<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoin Helper</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: 'Inter', sans-serif;
      background-color: #0b1326;
      color: #dae2fd;
      padding: 16px;
      user-select: none;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 12px;
      padding: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      background: linear-gradient(135deg, #8083ff, #ffdcc5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-icon {
      width: 24px;
      height: 24px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
    }
    .icon-btn:hover {
      color: #dae2fd;
      background: rgba(255, 255, 255, 0.1);
    }
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-online {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .preview {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .thumbnail {
      width: 100px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      background: #1e293b;
      flex-shrink: 0;
    }
    .meta {
      flex-grow: 1;
      min-width: 0;
    }
    .title {
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .uploader {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .format-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }
    .format-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(51, 65, 85, 0.4);
      border: 1px solid rgba(71, 85, 105, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      color: #dae2fd;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 12px;
      font-weight: 500;
    }
    .format-btn:hover {
      background: rgba(128, 131, 255, 0.2);
      border-color: #8083ff;
      transform: translateY(-1px);
    }
    .format-btn:active {
      transform: scale(0.98);
    }
    .fmt-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: #8083ff;
      color: #0b1326;
    }
    .progress-box {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bar-bg {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #8083ff, #ffdcc5);
      width: 0%;
      transition: width 0.3s ease;
    }
    .p-text {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
    }
    .notice-box {
      text-align: center;
      padding: 20px 10px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }
    .material-symbols-outlined {
      font-size: 16px;
    }
    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 8px;
      font-size: 12px;
      color: #8083ff;
    }
    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .btn-open-app {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: #8083ff;
      color: #0b1326;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-open-app:hover {
      filter: brightness(1.1);
    }
    #settings-panel {
      margin-bottom: 12px;
    }
    .settings-input-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .settings-input {
      flex-grow: 1;
      background: #1e293b;
      border: 1px solid #475569;
      color: #dae2fd;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }
    .settings-save-btn {
      background: #8083ff;
      color: #0b1326;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg class="logo-icon" viewBox="0 0 256 256" fill="none">
        <circle cx="128" cy="128" r="120" fill="#0B1326"/>
        <circle cx="128" cy="128" r="104" stroke="url(#grad)" stroke-width="12"/>
        <path d="M85 80L128 128M171 80L128 128M128 128V185M100 155L128 185M156 155L128 185" stroke="url(#grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="grad" x1="8" y1="8" x2="248" y2="248" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8083FF"/>
            <stop offset="1" stop-color="#FFDCC5"/>
          </linearGradient>
        </defs>
      </svg>
      <span>Yoin</span>
    </div>
    <div class="header-actions">
      <div id="server-status" class="status-badge status-offline">
        <span class="dot"></span>
        <span id="status-text">Checking...</span>
      </div>
      <button id="settings-toggle-btn" class="icon-btn" title="Server Settings">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </div>
  </div>

  <div id="settings-panel" style="display:none;" class="glass-card">
    <div style="font-size:11px; font-weight:700; color:#8083ff; text-transform:uppercase; tracking-wider:1px;">Server / Domain URL:</div>
    <div class="settings-input-group">
      <input id="server-url-input" class="settings-input" type="text" placeholder="https://yoin.yourdomain.com"/>
      <button id="save-server-url-btn" class="settings-save-btn">Save</button>
    </div>
  </div>

  <div id="content">
    <div class="loader">
      <span class="material-symbols-outlined spin">sync</span>
      <span>Detecting YouTube video...</span>
    </div>
  </div>

  <button id="open-app-btn" class="btn-open-app">
    <span class="material-symbols-outlined">open_in_new</span>
    <span>Open Yoin Web App</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
